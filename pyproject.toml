[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["backend", "matching", "pipelines", "llm", "embeddings"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["backend/app", "matching/openmatcher_matching", "pipelines/openmatcher_pipelines", "llm/openmatcher_llm"]

